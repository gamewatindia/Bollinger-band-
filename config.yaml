# source: gate | mexc | bybit | weex (USDT perpetual, Binance nahi) | csv (apna data: data/SYMBOL_TF.csv)
source: gate
csv_dir: data
symbols: all            # "all" ya list: [BTCUSDT, ETHUSDT]  (ya symbols.txt file path)
days: 365

# mtf   = base_tf par breakout, jab confluence_tfs par bhi squeeze ho (sab TF squeeze)
# single = har TF alag-alag test (single_tfs)
mode: mtf
base_tf: 15m
confluence_tfs: [1h, 4h]
single_tfs: [5m, 15m, 30m, 1h, 4h]

bb: {period: 20, std: 2.0}
squeeze:
  lookback: 120         # bandwidth ko itni candles ke saath compare
  quantile: 0.20        # bandwidth niche 20% me = squeeze
  min_bars: 6           # kam se kam itni candles lagatar squeeze

trade:
  margin_inr: 1000
  leverage: 10
  # price move % par partial exit; qty_pct ka total 100. Level hit -> SL us TP price par shift
  tp_levels:
    - {pct: 1, qty_pct: 25}
    - {pct: 2, qty_pct: 50}
    - {pct: 5, qty_pct: 25}
  max_sl_pct: 8                  # SL isse door ho to skip (10x me ~10% par liquidation)
  taker_fee_pct: 0.05            # per side, Shark ka actual fee yahan daalo
  slippage_pct: 0.02             # per side
